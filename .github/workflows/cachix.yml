name: cachix

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["update flake"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  cache:
    strategy:
      matrix:
        # the fork only feeds x86_64 laptops, so no arm build
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    if: ${{ github.repository == 'noctalia-dev/noctalia' || github.repository == 'kidskoding/noctalia' }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: "${{ secrets.CACHIX_CACHE_NAME }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: build
        run: |
          if [ "$GITHUB_REPOSITORY" = "kidskoding/noctalia" ]; then
            # nixos-config builds noctalia with inputs.nixpkgs.follows; build it the same way so the cache hits
            rev=$(curl -sf https://codeberg.org/kidskoding/nixos-config/raw/branch/master/flake.lock | jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev')
            mkdir -p "$RUNNER_TEMP/wrap"
            printf '{\n  inputs.nixpkgs.url = "github:NixOS/nixpkgs/%s";\n  inputs.noctalia.url = "github:%s/%s";\n  inputs.noctalia.inputs.nixpkgs.follows = "nixpkgs";\n  outputs = {noctalia, ...}: {packages = noctalia.packages;};\n}\n' "$rev" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/wrap/flake.nix"
            nix build "path:$RUNNER_TEMP/wrap#packages.$(nix eval --impure --raw --expr builtins.currentSystem).default" --fallback
          else
            nix build .#default --fallback
          fi

  push:
    needs: cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: push to cachix branch
        run: |
          git fetch origin main origin/cachix 2>/dev/null || true
          git merge-base --is-ancestor "${{ github.sha }}" origin/main || exit 0
          git merge-base --is-ancestor "${{ github.sha }}" origin/cachix 2>/dev/null && exit 0
          git push origin "${{ github.sha }}":refs/heads/cachix --force
